<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Esercizi di italiano A1 sui luoghi della città: abbina, completa, ordina, ascolta.">
<title>Luoghi della città</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  /* Layout: una colonna pensata per il telefono (360px), barra dei messaggi fissa in basso sotto il pollice.
     Pulsanti blu come i cartelli stradali su fondo grigio chiaro. */
  --bg: #EEF2F5;
  --surface: #FFFFFF;
  --ink: #12212F;
  --muted: #52626F;
  --line: #C5D0D9;
  --sign: #0A5AA8;
  --sign-ink: #FFFFFF;
  --sel: #FFD84D;
  --sel-ink: #12212F;
  --ok: #1B8A4B;
  --ok-bg: #D9F2E3;
  --ok-ink: #0E6636;
  --bad: #C62F2F;
  --bad-bg: #FADCDC;
  --bad-ink: #9E1B1B;
  --font: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1923; --surface: #192631; --ink: #EDF2F6; --muted: #9FB2C1; --line: #2F4252;
    --sign: #1B6DBF; --sign-ink: #FFFFFF; --sel: #FFD84D; --sel-ink: #12212F;
    --ok: #4CC882; --ok-bg: #12351F; --ok-ink: #8CE8B0;
    --bad: #FF7B7B; --bad-bg: #431B1B; --bad-ink: #FFA6A6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1923; --surface: #192631; --ink: #EDF2F6; --muted: #9FB2C1; --line: #2F4252;
  --sign: #1B6DBF; --sign-ink: #FFFFFF; --sel: #FFD84D; --sel-ink: #12212F;
  --ok: #4CC882; --ok-bg: #12351F; --ok-ink: #8CE8B0;
  --bad: #FF7B7B; --bad-bg: #431B1B; --bad-ink: #FFA6A6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.3;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap {
  max-width: 520px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: calc(100vh - 12px);
  min-height: calc(100dvh - 12px);
}
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; }
.top[hidden] { display: none; }
.brand { min-width: 0; }
.kicker { font-size: .75rem; letter-spacing: .14em; font-weight: 700; color: var(--muted); }
h1 { margin: 0; font-size: 1.15rem; line-height: 1.1; text-transform: uppercase; text-wrap: balance; }
h1.big { font-size: clamp(1.6rem, 7.5vw, 2.1rem); }
h2 { margin: 0; font-size: 2.2rem; text-transform: uppercase; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button:focus-visible { outline: 4px solid var(--sign); outline-offset: 3px; }

.btn, .tile, .chip, .icon-btn, .hear {
  position: relative;
  background: var(--surface);
  border: 3px solid var(--line);
  border-radius: 16px;
  font-weight: 700;
  text-transform: uppercase;
}
.btn { min-height: 60px; padding: 10px 16px; font-size: 1.2rem; }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--sign-ink); }
.icon-btn { width: 52px; height: 52px; flex: none; font-size: 1.5rem; padding: 0; }
.btn:disabled, .tile:disabled, .chip:disabled { cursor: default; }

/* Menu in stile cartello */
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.sign {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 10px 18px;
  background: var(--sign); color: var(--sign-ink);
  border: 4px solid var(--sign); border-radius: 18px;
  box-shadow: inset 0 0 0 3px var(--sign-ink);
  font-size: 1.5rem; font-weight: 700; letter-spacing: .04em; text-align: left;
}
.sign .ico { font-size: 2rem; line-height: 1; }
.sign .lbl { flex: 1; }
.sign .arr { font-size: 1.5rem; }
.sign.alt { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: inset 0 0 0 3px var(--line); }
.hint { margin: 0; text-align: center; color: var(--muted); font-weight: 700; }

/* Esercizi */
.act { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.dots { display: flex; gap: 10px; justify-content: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--sign); background: transparent; }
.dot.done { background: var(--sign); }
.dot.cur { background: var(--sel); transform: scale(1.2); }
.instr { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 700; text-transform: uppercase; line-height: 1.15; }
.instr .ii { font-size: 1.5rem; }
.stage { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Barra in basso: messaggio + avanti */
.dock {
  position: sticky; bottom: 0; z-index: 5; margin-top: auto;
  display: flex; gap: 10px; align-items: stretch;
  padding-top: 10px;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  background: var(--bg);
}
.msg {
  flex: 1 1 0; min-width: 0; min-height: 60px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 16px; border: 3px solid transparent;
  font-size: 1.15rem; line-height: 1.1; font-weight: 700; text-align: center;
}
.msg.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok); }
.msg.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad); }
.msg .mi { font-size: 1.4rem; }
.dock .btn { flex: 0 0 auto; min-height: 60px; }
.dock .btn[hidden] { display: none; }

/* Disegni */
.pic { display: block; width: 100%; height: auto; border-radius: 12px; }

/* Abbina: 3 coppie per turno */
.pairs { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 12px; }
.col { display: grid; gap: 12px; align-content: start; }
.tile { min-height: 84px; padding: 6px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(.95rem, 4.6vw, 1.2rem); }
.tile .wd { padding: 0 4px; }
.tile .im { display: block; width: 100%; }
.tile.sel { background: var(--sel); color: var(--sel-ink); border-color: var(--sel-ink); box-shadow: 0 0 0 3px var(--sel); }

/* Giusto / sbagliato */
.tile.ok, .opt.ok, .chip.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok-ink); opacity: 1; }
.tile.bad, .opt.bad, .chip.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad-ink); opacity: 1; }
.tile.ok::after, .opt.ok::after, .tile.bad::after, .opt.bad::after {
  position: absolute; top: 4px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 700; color: #fff;
}
.tile.ok::after, .opt.ok::after { content: "✓"; background: var(--ok); }
.tile.bad::after, .opt.bad::after { content: "✕"; background: var(--bad); }
@media (prefers-reduced-motion: no-preference) {
  .tile.bad, .opt.bad, .line.bad { animation: shake .35s; }
}
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* Completa / Ordina / Ascolta */
.hero { display: flex; align-items: center; justify-content: center; gap: 12px; }
.hero .pic { width: min(220px, 60vw); }
.hero.small .pic { width: min(170px, 46vw); }
.hear { width: 60px; height: 60px; flex: none; font-size: 1.6rem; padding: 0; background: var(--sign); border-color: var(--sign); color: var(--sign-ink); border-radius: 50%; }
.hear.huge { width: 88px; height: 88px; font-size: 2.4rem; align-self: center; }
.sent { margin: 0; text-align: center; font-size: clamp(1.25rem, 5.8vw, 1.5rem); font-weight: 700; text-transform: uppercase; text-wrap: balance; }
.blank { display: inline-block; width: 4.5ch; border-bottom: 4px solid var(--ink); margin: 0 4px; }
.fill { display: inline-block; padding: 0 8px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-ink); border-bottom: 4px solid var(--ok); }
.opts { display: grid; gap: 10px; }
.opt { min-height: 62px; font-size: 1.3rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .tile { padding: 6px; }
.caption { min-height: 1.5rem; margin: 0; text-align: center; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; color: var(--ok-ink); }

.line { min-height: 76px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: var(--surface); border: 3px dashed var(--line); border-radius: 16px; }
.line.ok { border-style: solid; border-color: var(--ok); background: var(--ok-bg); }
.line.bad { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }
.line .end { font-size: 1.5rem; font-weight: 700; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 60px; }
.chip { min-height: 54px; padding: 8px 14px; font-size: clamp(1.05rem, 5vw, 1.25rem); }
.check { align-self: stretch; }

/* Parole */
.words { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.words .tile { flex-direction: column; gap: 6px; padding: 6px 6px 10px; }

/* Fine */
.done { display: flex; flex-direction: column; gap: 16px; text-align: center; padding-top: 24px; }
.done .party { font-size: 5rem; line-height: 1; }
.done p { margin: 0; font-size: 1.4rem; font-weight: 700; }
.done .btns { display: flex; flex-direction: column; gap: 12px; }

.note { margin: 0 0 12px; text-align: center; font-weight: 700; color: var(--bad-ink); }
.note[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <button class="icon-btn" id="homeBtn" aria-label="Menu">🏠</button>
    <div class="brand">
      <div class="kicker">ITALIANO · A1</div>
      <h1>I luoghi della città</h1>
    </div>
  </header>
  <main id="app"></main>
  <p class="note" id="audioNote" hidden>🔇 Audio non disponibile</p>
</div>

      '<rect x="18" y="40" width="6" height="30" fill="#8B5E3C"/>' +
      '<circle cx="21" cy="32" r="15" fill="#4FA35C"/><circle cx="11" cy="42" r="10" fill="#5DB56A"/><circle cx="31" cy="42" r="10" fill="#5DB56A"/>' +
      '<rect x="98" y="46" width="5" height="22" fill="#8B5E3C"/>' +
      '<circle cx="100" cy="38" r="12" fill="#4FA35C"/><circle cx="92" cy="46" r="8" fill="#5DB56A"/><circle cx="108" cy="46" r="8" fill="#5DB56A"/>' +
      '<rect x="34" y="70" width="20" height="3" fill="#8B5E3C"/><rect x="34" y="63" width="20" height="2.5" fill="#8B5E3C"/>' +
      '<rect x="36" y="63" width="2" height="8" fill="#8B5E3C"/><rect x="50" y="63" width="2" height="8" fill="#8B5E3C"/>' +
      '<rect x="36" y="73" width="2" height="6" fill="#6B4A30"/><rect x="50" y="73" width="2" height="6" fill="#6B4A30"/>' +
      '<circle cx="12" cy="82" r="1.8" fill="#D64545"/><circle cx="26" cy="90" r="1.8" fill="#F2B632"/><circle cx="104" cy="84" r="1.8" fill="#F2B632"/><circle cx="112" cy="92" r="1.8" fill="#D64545"/>'),

    bar: svg(SKY + GND +
      '<rect x="8" y="36" width="78" height="46" fill="#F4D6A0"/>' +
      '<rect x="24" y="16" width="48" height="18" rx="3" fill="#3E2F2A"/>' +
      '<path d="M42 25h12v4a6 6 0 0 1-12 0z" fill="#fff"/>' +
      '<path d="M54 26h2a2.8 2.8 0 0 1 0 5.6h-2" fill="none" stroke="#fff" stroke-width="1.4"/>' +
      '<path d="M45 22q2-2 0-4M50 22q2-2 0-4" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>' +
      stripes(8, 36, 78, 10, 6, '#D64545', '#FFFFFF') +
      '<rect x="14" y="54" width="30" height="24" fill="#BEE0F0" stroke="' + DARK + '" stroke-width="1.5"/>' +
      '<rect x="14" y="70" width="30" height="8" fill="#8B5E3C"/>' +
      '<rect x="54" y="52" width="24" height="30" fill="#BEE0F0" stroke="' + DARK + '" stroke-width="1.5"/>' +
      '<rect x="92" y="70" width="22" height="3.5" rx="1.5" fill="#fff" stroke="' + DARK + '" stroke-width="1"/>' +
      '<rect x="101" y="73.5" width="4" height="8.5" fill="' + DARK + '"/>' +
      '<rect x="95" y="64" width="6" height="5.5" rx="1" fill="#fff" stroke="' + DARK + '" stroke-width="1"/>' +
      '<rect x="106" y="64" width="6" height="5.5" rx="1" fill="#fff" stroke="' + DARK + '" stroke-width="1"/>'),

    ristorante: svg(SKY + GND +
      '<rect x="8" y="34" width="104" height="48" fill="#E9A98B"/>' +
      '<rect x="59" y="32" width="2" height="4" fill="' + DARK + '"/>' +
      '<circle cx="60" cy="19" r="13" fill="#fff" stroke="' + DARK + '" stroke-width="2"/>' +
      '<path d="M50 11v6a3 3 0 0 0 6 0v-6M53 11v18" fill="none" stroke="' + DARK + '" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path d="M66 11C71 14 71 21 66 24Z" fill="' + DARK + '"/><path d="M66 24v5" stroke="' + DARK + '" stroke-width="1.5" stroke-linecap="round"/>' +
      '<rect x="8" y="34" width="104" height="8" fill="#2E7D4F"/>' +
      '<circle cx="14.5" cy="42" r="6.5" fill="#2E7D4F"/><circle cx="27.5" cy="42" r="6.5" fill="#2E7D4F"/><circle cx="40.5" cy="42" r="6.5" fill="#2E7D4F"/><circle cx="53.5" cy="42" r="6.5" fill="#2E7D4F"/><circle cx="66.5" cy="42" r="6.5" fill="#2E7D4F"/><circle cx="79.5" cy="42" r="6.5" fill="#2E7D4F"/><circle cx="92.5" cy="42" r="6.5" fill="#2E7D4F"/><circle cx="105.5" cy="42" r="6.5" fill="#2E7D4F"/>' +
      '<rect x="16" y="52" width="54" height="26" fill="#FFE7A8" stroke="' + DARK + '" stroke-width="1.5"/>' +
      '<rect x="24" y="64" width="38" height="3" fill="#fff"/><rect x="31" y="67" width="3" height="11" fill="' + DARK + '"/><rect x="52" y="67" width="3" height="11" fill="' + DARK + '"/>' +
      '<ellipse cx="30" cy="62.5" rx="5" ry="1.6" fill="#fff" stroke="' + DARK + '" stroke-width=".8"/><ellipse cx="56" cy="62.5" rx="5" ry="1.6" fill="#fff" stroke="' + DARK + '" stroke-width=".8"/>' +
      '<rect x="41.5" y="58" width="2.5" height="6" fill="#fff"/><circle cx="42.7" cy="56" r="1.7" fill="#F28C28"/>' +
      '<rect x="78" y="48" width="24" height="34" fill="#5A3E2B"/><rect x="84" y="52" width="12" height="12" rx="6" fill="#FFE7A8"/>')
  };
  function pic(id) { return IMG[id]; }

  /* ---------- Dati ---------- */
  var PLACES = [
    { id: 'scuola', a: 'LA', w: 'SCUOLA', blank: 'Gli studenti vanno a ___.', say: 'Gli studenti vanno a scuola.' },
    { id: 'ospedale', a: "L'", w: 'OSPEDALE', blank: "Il dottore lavora all'___.", say: "Il dottore lavora all'ospedale." },
    { id: 'farmacia', a: 'LA', w: 'FARMACIA', blank: 'Compro le medicine in ___.', say: 'Compro le medicine in farmacia.' },
    { id: 'supermercato', a: 'IL', w: 'SUPERMERCATO', blank: 'Compro il pane al ___.', say: 'Compro il pane al supermercato.' },
    { id: 'banca', a: 'LA', w: 'BANCA', blank: 'Ritiro i soldi in ___.', say: 'Ritiro i soldi in banca.' },
    { id: 'posta', a: 'LA', w: 'POSTA', blank: 'Spedisco una lettera alla ___.', say: 'Spedisco una lettera alla posta.' },
    { id: 'stazione', a: 'LA', w: 'STAZIONE', blank: 'Il treno arriva alla ___.', say: 'Il treno arriva alla stazione.' },
    { id: 'parco', a: 'IL', w: 'PARCO', blank: 'I bambini giocano nel ___.', say: 'I bambini giocano nel parco.' },
    { id: 'bar', a: 'IL', w: 'BAR', blank: 'Bevo un caffè al ___.', say: 'Bevo un caffè al bar.', no: ['ristorante'] },
    { id: 'ristorante', a: 'IL', w: 'RISTORANTE', blank: 'Mangio la pizza al ___.', say: 'Mangio la pizza al ristorante.', no: ['bar'] }
  ];
  var SENTS = [
    { pid: 'scuola', w: ['IO', 'VADO', 'A', 'SCUOLA'], end: '.', say: 'Io vado a scuola.' },
    { pid: 'parco', w: ['IO', 'VADO', 'AL', 'PARCO'], end: '.', say: 'Io vado al parco.' },
    { pid: 'banca', w: ['IO', 'VADO', 'IN', 'BANCA'], end: '.', say: 'Io vado in banca.' },
    { pid: 'stazione', w: ["DOV'È", 'LA', 'STAZIONE'], end: '?', say: "Dov'è la stazione?" },
    { pid: 'posta', w: ['LA', 'POSTA', 'È', 'QUI'], end: '.', say: 'La posta è qui.' },
    { pid: 'bar', w: ['IL', 'BAR', 'È', 'A', 'DESTRA'], end: '.', say: 'Il bar è a destra.' },
    { pid: 'farmacia', w: ['LA', 'FARMACIA', 'È', 'A', 'SINISTRA'], end: '.', say: 'La farmacia è a sinistra.' },
    { pid: 'ospedale', w: ["L'OSPEDALE", 'È', 'QUI'], end: '.', say: "L'ospedale è qui." },
    { pid: 'ristorante', w: ['IL', 'RISTORANTE', 'È', 'QUI'], end: '.', say: 'Il ristorante è qui.' }
  ];
  var OK = ['BRAVO!', 'MOLTO BENE!', 'GIUSTO!', 'PERFETTO!', 'OTTIMO!'];
  var BAD = ['RIPROVA!', 'QUASI! RIPROVA!', 'ANCORA!'];

  var byId = {};
  PLACES.forEach(function (p) { byId[p.id] = p; });
  var app = document.getElementById('app');
  var topBar = document.getElementById('top');
  var S = { mode: null, i: 0, n: 0 };

  function label(p) { return p.a + (p.a.slice(-1) === "'" ? '' : ' ') + p.w; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function distract(p, k) {
    return shuffle(PLACES.filter(function (x) {
      return x.id !== p.id && (p.no || []).indexOf(x.id) < 0;
    })).slice(0, k);
  }

  /* ---------- Audio: voce italiana del telefono ---------- */
  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) { document.getElementById('audioNote').hidden = false; return; }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'it-IT';
      u.rate = 0.8;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var k = 0; k < voices.length; k++) {
        if (voices[k].lang && voices[k].lang.toLowerCase().replace('_', '-').indexOf('it') === 0) { u.voice = voices[k]; break; }
      }
      window.speechSynthesis.speak(u);
    } catch (err) {
      document.getElementById('audioNote').hidden = false;
    }
  }

  function msg(kind, text) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.className = 'msg' + (kind ? ' ' + kind : '');
    m.innerHTML = kind ? '<span class="mi" aria-hidden="true">' + (kind === 'ok' ? '✓' : '✕') + '</span><span>' + text + '</span>' : '';
  }
  function showNext() {
    var b = document.getElementById('nextBtn');
    if (b) b.hidden = false;
  }
  function stage() { return document.getElementById('stage'); }
  function toTop() { try { window.scrollTo(0, 0); } catch (e) {} }

  function shell(icon, text) {
    var dots = '';
    for (var i = 0; i < S.n; i++) {
      dots += '<i class="dot' + (i < S.i ? ' done' : '') + (i === S.i ? ' cur' : '') + '"></i>';
    }
    return '<section class="act">' +
      '<div class="dots" aria-hidden="true">' + dots + '</div>' +
      '<p class="instr"><span class="ii" aria-hidden="true">' + icon + '</span><span>' + text + '</span></p>' +
      '<div id="stage" class="stage"></div>' +
      '<div class="dock"><div id="msg" class="msg" role="status" aria-live="polite"></div>' +
      '<button class="btn primary" id="nextBtn" data-a="next" hidden>AVANTI ➜</button></div>' +
      '</section>';
  }

  /* ---------- Schermate ---------- */
  function showHome() {
    topBar.hidden = true;
    S.mode = null;
    app.innerHTML =
      '<div class="brand" style="margin-bottom:14px"><div class="kicker">ITALIANO · A1</div><h1 class="big">I luoghi della città</h1></div>' +
      '<ul class="menu">' +
      '<li><button class="sign alt" data-a="words"><span class="ico">📖</span><span class="lbl">PAROLE</span><span class="arr">➜</span></button></li>' +
      '<li><button class="sign" data-a="start" data-m="match"><span class="ico">🔗</span><span class="lbl">ABBINA</span><span class="arr">➜</span></button></li>' +
      '<li><button class="sign" data-a="start" data-m="completa"><span class="ico">✏️</span><span class="lbl">COMPLETA</span><span class="arr">➜</span></button></li>' +
      '<li><button class="sign" data-a="start" data-m="ordina"><span class="ico">🔀</span><span class="lbl">ORDINA</span><span class="arr">➜</span></button></li>' +
      '<li><button class="sign" data-a="start" data-m="ascolta"><span class="ico">🎧</span><span class="lbl">ASCOLTA</span><span class="arr">➜</span></button></li>' +
      '</ul>' +
      '<p class="hint" style="margin-top:14px">🔊 Alza il volume</p>';
    toTop();
  }

  function showWords() {
    topBar.hidden = false;
    S.mode = 'words';
    app.innerHTML =
      '<section class="act"><p class="instr"><span class="ii" aria-hidden="true">👆</span><span>TOCCA E ASCOLTA</span></p>' +
      '<div class="words">' + PLACES.map(function (p) {
        return '<button class="tile" data-a="wpick" data-id="' + p.id + '">' + pic(p.id) + '<span>' + label(p) + '</span></button>';
      }).join('') + '</div></section>';
    toTop();
  }

  function startMode(m) {
    topBar.hidden = false;
    S.mode = m; S.i = 0;
    if (m === 'match') {
      var ps = shuffle(PLACES).slice(0, 9);
      S.rounds = [ps.slice(0, 3), ps.slice(3, 6), ps.slice(6, 9)];
      S.n = 3;
    } else if (m === 'completa') {
      S.qs = shuffle(PLACES).slice(0, 6).map(function (p) {
        return { p: p, opts: shuffle([p].concat(distract(p, 2))) };
      });
      S.n = 6;
    } else if (m === 'ordina') {
      S.qs = shuffle(SENTS).slice(0, 6);
      S.n = 6;
    } else {
      S.qs = shuffle(PLACES).slice(0, 6).map(function (p, i) {
        return { p: p, type: (i % 3 === 2) ? 's' : 'w', opts: shuffle([p].concat(distract(p, 3))) };
      });
      S.n = 6;
    }
    showQ();
  }

  function showQ() {
    if (S.i >= S.n) { showDone(); return; }
    ({ match: showMatch, completa: showCompleta, ordina: showOrdina, ascolta: showAscolta })[S.mode]();
    toTop();
  }

  function showDone() {
    app.innerHTML =
      '<section class="done"><div class="party" aria-hidden="true">🎉</div><h2>BRAVO!</h2><p>HAI FINITO!</p>' +
      '<div class="btns"><button class="btn primary" data-a="start" data-m="' + S.mode + '">🔁 ANCORA</button>' +
      '<button class="btn" data-a="home">🏠 MENU</button></div></section>';
    toTop();
  }

  /* ---------- ABBINA ---------- */
  function showMatch() {
    var ps = S.rounds[S.i];
    S.m = { ps: ps, L: shuffle(ps), R: shuffle(ps), done: {}, count: 0, l: null, r: null, bad: false, lock: false };
    app.innerHTML = shell('👆', "TOCCA IL DISEGNO. TOCCA LA PAROLA.");
    paintMatch();
  }
  function paintMatch() {
    var m = S.m;
    function tile(side, p) {
      var d = !!m.done[p.id];
      var sel = (side === 'l' ? m.l : m.r) === p.id;
      var cls = 'tile' + (d ? ' ok' : (sel ? (m.bad ? ' bad' : ' sel') : ''));
      var inner = side === 'l' ? '<span class="im">' + pic(p.id) + '</span>' : '<span class="wd">' + label(p) + '</span>';
      return '<button class="' + cls + '" data-a="mpick" data-side="' + side + '" data-id="' + p.id + '"' + (d ? ' disabled' : '') + '>' + inner + '</button>';
    }
    stage().innerHTML = '<div class="pairs"><div class="col">' + m.L.map(function (p) { return tile('l', p); }).join('') +
      '</div><div class="col">' + m.R.map(function (p) { return tile('r', p); }).join('') + '</div></div>';
  }
  function matchPick(b) {
    var m = S.m;
    if (m.lock) return;
    var side = b.dataset.side, id = b.dataset.id;
    speak(label(byId[id]).toLowerCase());
    m[side] = (m[side] === id) ? null : id;
    msg('', '');
    if (m.l && m.r) {
      if (m.l === m.r) {
        m.done[m.l] = true; m.count++; m.l = null; m.r = null;
        paintMatch();
        msg('ok', rnd(OK));
        if (m.count === m.ps.length) showNext();
      } else {
        m.bad = true; m.lock = true;
        paintMatch();
        msg('bad', rnd(BAD));
        setTimeout(function () { m.l = null; m.r = null; m.bad = false; m.lock = false; paintMatch(); }, 900);
      }
    } else {
      paintMatch();
    }
  }

  /* ---------- COMPLETA ---------- */
  function showCompleta() {
    S.c = { q: S.qs[S.i], wrong: {}, solved: false };
    app.innerHTML = shell('👆', 'SCEGLI LA PAROLA.');
    paintCompleta();
  }
  function paintCompleta() {
    var c = S.c, q = c.q;
    var parts = q.p.blank.split('___');
    var blank = c.solved ? '<span class="fill">' + q.p.w + '</span>' : '<span class="blank"></span>';
    stage().innerHTML =
      '<div class="hero">' + pic(q.p.id) +
      '<button class="hear" data-a="hear" data-say="' + esc(q.p.say) + '" aria-label="Ascolta">🔊</button></div>' +
      '<p class="sent">' + parts[0] + blank + parts[1] + '</p>' +
      '<div class="opts">' + q.opts.map(function (o) {
        var w = !!c.wrong[o.id], ok = c.solved && o.id === q.p.id;
        return '<button class="btn opt' + (w ? ' bad' : '') + (ok ? ' ok' : '') + '" data-a="cpick" data-id="' + o.id + '"' + ((w || c.solved) ? ' disabled' : '') + '>' + o.w + '</button>';
      }).join('') + '</div>';
  }
  function completaPick(b) {
    var c = S.c;
    if (c.solved) return;
    if (b.dataset.id === c.q.p.id) {
      c.solved = true; paintCompleta(); speak(c.q.p.say); msg('ok', rnd(OK)); showNext();
    } else {
      c.wrong[b.dataset.id] = true; paintCompleta(); msg('bad', rnd(BAD));
    }
  }

  /* ---------- ORDINA ---------- */
  function showOrdina() {
    var s = S.qs[S.i];
    S.o = { s: s, chips: shuffle(s.w.map(function (w, i) { return { id: i, w: w }; })), placed: [], state: '' };
    app.innerHTML = shell('👆', 'METTI LE PAROLE IN ORDINE.');
    paintOrdina();
  }
  function paintOrdina() {
    var o = S.o;
    var pl = o.placed.map(function (id) { return o.chips.filter(function (c) { return c.id === id; })[0]; });
    var free = o.chips.filter(function (c) { return o.placed.indexOf(c.id) < 0; });
    var full = o.placed.length === o.chips.length;
    stage().innerHTML =
      '<div class="hero small">' + pic(o.s.pid) +
      '<button class="hear" data-a="hear" data-say="' + esc(o.s.say) + '" aria-label="Ascolta">🔊</button></div>' +
      '<div class="line' + (o.state ? ' ' + o.state : '') + '">' +
      pl.map(function (c) {
        return '<button class="chip' + (o.state ? ' ' + o.state : '') + '" data-a="oun" data-id="' + c.id + '"' + (o.state === 'ok' ? ' disabled' : '') + '>' + c.w + '</button>';
      }).join('') + (pl.length ? '<span class="end">' + o.s.end + '</span>' : '') + '</div>' +
      '<div class="bank">' + free.map(function (c) {
        return '<button class="chip" data-a="oadd" data-id="' + c.id + '">' + c.w + '</button>';
      }).join('') + '</div>' +
      (full && o.state !== 'ok' ? '<button class="btn primary check" data-a="ocheck">✓ CONTROLLA</button>' : '');
  }
  function ordinaAdd(b) {
    var o = S.o;
    if (o.state === 'ok') return;
    o.state = ''; msg('', '');
    o.placed.push(parseInt(b.dataset.id, 10));
    paintOrdina();
  }
  function ordinaRemove(b) {
    var o = S.o;
    if (o.state === 'ok') return;
    o.state = ''; msg('', '');
    var id = parseInt(b.dataset.id, 10);
    o.placed = o.placed.filter(function (x) { return x !== id; });
    paintOrdina();
  }
  function ordinaCheck() {
    var o = S.o;
    var right = o.placed.every(function (id, i) { return id === i; });
    if (right) {
      o.state = 'ok'; paintOrdina(); speak(o.s.say); msg('ok', rnd(OK)); showNext();
    } else {
      o.state = 'bad'; paintOrdina(); msg('bad', rnd(BAD));
    }
  }

  /* ---------- ASCOLTA ---------- */
  function sayText(q) { return q.type === 'w' ? label(q.p).toLowerCase() : q.p.say; }
  function showAscolta() {
    S.a = { q: S.qs[S.i], wrong: {}, solved: false };
    app.innerHTML = shell('🔊', "ASCOLTA. TOCCA IL DISEGNO.");
    paintAscolta();
    speak(sayText(S.a.q));
  }
  function paintAscolta() {
    var a = S.a, q = a.q;
    stage().innerHTML =
      '<button class="hear huge" data-a="hear" data-say="' + esc(sayText(q)) + '" aria-label="Ascolta">🔊</button>' +
      '<p class="caption">' + (a.solved ? (q.type === 'w' ? label(q.p) : q.p.say) : '') + '</p>' +
      '<div class="grid2">' + q.opts.map(function (o) {
        var w = !!a.wrong[o.id], ok = a.solved && o.id === q.p.id;
        return '<button class="tile opt' + (w ? ' bad' : '') + (ok ? ' ok' : '') + '" data-a="apick" data-id="' + o.id + '"' + ((w || a.solved) ? ' disabled' : '') + '>' + pic(o.id) + '</button>';
      }).join('') + '</div>';
  }
  function ascoltaPick(b) {
    var a = S.a;
    if (a.solved) return;
    if (b.dataset.id === a.q.p.id) {
      a.solved = true; paintAscolta(); msg('ok', rnd(OK)); showNext();
    } else {
      a.wrong[b.dataset.id] = true; paintAscolta(); msg('bad', rnd(BAD));
    }
  }

  /* ---------- Eventi ---------- */
  var H = {
    start: function (b) { startMode(b.dataset.m); },
    words: showWords,
    home: showHome,
    hear: function (b) { speak(b.dataset.say); },
    next: function () { S.i++; showQ(); },
    wpick: function (b) { speak(label(byId[b.dataset.id]).toLowerCase()); },
    mpick: matchPick,
    cpick: completaPick,
    oadd: ordinaAdd,
    oun: ordinaRemove,
    ocheck: ordinaCheck,
    apick: ascoltaPick
  };
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    var f = H[b.dataset.a];
    if (f) f(b);
  });
  document.getElementById('homeBtn').addEventListener('click', function () {
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    showHome();
  });
  try { if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); } catch (e) {}

  showHome();
})();
</script>
</body>
</html>
